[project]
name = "document-worker"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = ["markitdown[docx,pdf,pptx,xls,xlsx]==0.1.6"]

[project.scripts]
document-worker = "document_worker.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
build = ["pyinstaller>=6.1,<7"]

[tool.ruff]
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
