[package]
name = "ia-toolbox"
# Cargo requires a version, but the app's is read from package.json via
# tauri.conf.json so that Changesets has a single file to bump. Tauri only falls
# back to this one when tauri.conf.json sets none, and 0.0.0 makes a regression
# to that fallback obvious in a bundle instead of plausible.
version = "0.0.0"
description = "Local document tools"
edition = "2021"

[lib]
name = "ia_toolbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
