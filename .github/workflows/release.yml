name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (must already exist)"
        required: true

permissions:
  contents: write

jobs:
  bundle:
    name: Bundle (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    # Holds the signing secrets. Configure required reviewers on the `release`
    # environment (Settings -> Environments) so they are only ever handed to an
    # approved run. Third-party actions below are pinned to commit SHAs for the
    # same reason: a mutable tag could be repointed at code that exfiltrates
    # the Apple certificate or the updater private key.
    environment: release
    strategy:
      fail-fast: false
      matrix:
        # PyInstaller cannot cross-compile, so each target needs a runner of
        # that architecture: `pnpm dev:worker` names the sidecar after the host
        # triple, and Tauri looks it up by the build target.
        include:
          - os: macos-latest # Apple Silicon
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - run: pnpm install --frozen-lockfile

      # The `build` group holds PyInstaller, which a default sync would omit.
      - name: Sync Python environment
        run: uv sync --project python --locked --group build

      # Builds the worker with PyInstaller and places it as
      # src-tauri/binaries/document-worker-<host-triple>, without running
      # `tauri build` — tauri-action does that below.
      - name: Build worker sidecar
        run: pnpm dev:worker

      - name: Bundle and upload
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          # macOS code signing. Every secret here is optional: unset secrets
          # expand to empty strings, Tauri then skips signing, and the bundle is
          # produced unsigned. That is also why `pnpm app:build` works locally
          # without any of them.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # Notarization. Optional, and independent of signing.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Updater artifact signing. Produces .sig files only once the updater
          # is configured in tauri.conf.json — see CONTRIBUTING.md.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: IA Toolbox ${{ inputs.tag || github.ref_name }}
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}
