name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (must already exist)"
        required: true

permissions:
  contents: write

jobs:
  bundle:
    name: Bundle (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # PyInstaller cannot cross-compile, so each target needs a runner of
        # that architecture: `pnpm dev:worker` names the sidecar after the host
        # triple, and Tauri looks it up by the build target.
        include:
          - os: macos-latest # Apple Silicon
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - run: pnpm install --frozen-lockfile

      # The `build` group holds PyInstaller, which a default sync would omit.
      - name: Sync Python environment
        run: uv sync --project python --locked --group build

      # Builds the worker with PyInstaller and places it as
      # src-tauri/binaries/document-worker-<host-triple>, without running
      # `tauri build` — tauri-action does that below.
      - name: Build worker sidecar
        run: pnpm dev:worker

      - name: Bundle and upload
        uses: tauri-apps/tauri-action@v1
        env:
          # macOS code signing. Every secret here is optional: unset secrets
          # expand to empty strings, Tauri then skips signing, and the bundle is
          # produced unsigned. That is also why `pnpm app:build` works locally
          # without any of them.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # Notarization. Optional, and independent of signing.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Updater artifact signing. Produces .sig files only once the updater
          # is configured in tauri.conf.json — see CONTRIBUTING.md.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: IA Toolbox ${{ inputs.tag || github.ref_name }}
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}
